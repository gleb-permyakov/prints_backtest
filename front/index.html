<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Бектест · 5s свечи</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <!-- fallback CDN на случай, если unpkg заблокирован -->
  <script>
    if (typeof LightweightCharts === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"><\/script>');
    }
  </script>

  <style>
    #chart { -webkit-tap-highlight-color: transparent; height: 560px; min-height: 560px; }
    #chart a[href] { display: none !important; }
    #status:empty { display: none; }
  </style>
</head>

<body class="min-h-screen bg-slate-950 text-slate-200 antialiased">
  <div class="mx-auto max-w-7xl p-4 md:p-6">

    <header class="mb-4 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold text-white">Бектест стратегии</h1>
        <p class="text-sm text-slate-400">
          Таймфрейм: <span class="text-slate-200 font-medium">5 секунд</span> ·
          <span id="coinName" class="text-slate-200 font-medium">—</span> ·
          <span id="periodLabel" class="text-slate-500"></span>
        </p>
      </div>
      <label class="flex cursor-pointer select-none items-center gap-2 text-sm text-slate-300">
        <input id="toggleTrades" type="checkbox" checked class="h-4 w-4 cursor-pointer accent-emerald-500" />
        Показывать сделки
      </label>
    </header>

    <!-- ВИДИМЫЙ ЛОГ -->
    <div id="status" class="mb-4 max-h-56 overflow-auto rounded-lg border border-slate-800 bg-slate-900/60 p-3 font-mono text-xs leading-relaxed text-slate-400"></div>

    <div class="mb-5 grid grid-cols-2 gap-3 md:grid-cols-4">
      <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="text-xs uppercase tracking-wide text-slate-500">Сделок</div>
        <div id="statTrades" class="mt-1 text-xl font-semibold text-white">—</div>
      </div>
      <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="text-xs uppercase tracking-wide text-slate-500">Winrate</div>
        <div id="statWinrate" class="mt-1 text-xl font-semibold text-white">—</div>
      </div>
      <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="text-xs uppercase tracking-wide text-slate-500">Суммарный PnL</div>
        <div id="statPnl" class="mt-1 text-xl font-semibold text-white">—</div>
      </div>
      <div class="rounded-xl border border-slate-800 bg-slate-900/60 p-4">
        <div class="text-xs uppercase tracking-wide text-slate-500">Profit factor</div>
        <div id="statPf" class="mt-1 text-xl font-semibold text-white">—</div>
      </div>
    </div>

    <div class="rounded-xl border border-slate-800 bg-slate-900 p-2">
      <div id="chart" style="height:560px"></div>
    </div>

    <div class="mt-3 flex flex-wrap items-center gap-x-6 gap-y-2 text-xs text-slate-400">
      <span class="flex items-center gap-2">
        <span class="inline-block h-2.5 w-2.5 rounded-sm bg-emerald-500"></span> профитная сделка
      </span>
      <span class="flex items-center gap-2">
        <span class="inline-block h-2.5 w-2.5 rounded-sm bg-red-500"></span> убыточная сделка
      </span>
      <span class="flex items-center gap-2">
        <span class="text-emerald-400">▲</span> вход (IN) ·
        <span class="text-emerald-400">▼</span> выход (OUT +PnL)
      </span>
      <span class="ml-auto text-slate-600">колесо мыши — зум, перетаскивание — скролл</span>
    </div>
  </div>

<script>
(async () => {
  'use strict';

  /* ================= ВИДИМЫЙ ЛОГ ================= */
  const statusEl = document.getElementById('status');
  const log = (msg, cls) => {
    const line = document.createElement('div');
    if (cls) line.className = cls;
    const t = new Date().toLocaleTimeString('ru-RU', { hour12: false });
    line.textContent = `[${t}] ${msg}`;
    statusEl.appendChild(line);
    statusEl.scrollTop = statusEl.scrollHeight;
    console.log(msg);
  };

  const $ = id => document.getElementById(id);

  log('Скрипт запущен');
  log('LightweightCharts: ' +
      (typeof LightweightCharts !== 'undefined' ? 'OK ✓' : 'НЕ загружен ✗'));

  if (typeof LightweightCharts === 'undefined') {
    log('CDN lightweight-charts не загрузился. Скорее всего блокируется unpkg/jsdelivr.',
        'text-red-400');
    return;
  }

  /* ================= КОНФИГ ================= */
  const SYMBOL    = 'ONEUSDT';
  const START_SEC = 1789849389;
  const END_SEC   = 1789852862;
  const START_MS  = START_SEC * 1000;
  const END_MS    = END_SEC   * 1000;
  const TF_SEC    = 5;

  log(`Символ: ${SYMBOL}`);
  log(`Период: ${new Date(START_MS).toLocaleString('ru-RU')} — ${new Date(END_MS).toLocaleString('ru-RU')}`);

  const HOSTS = [
    'https://data-api.binance.vision',
    'https://api.binance.com',
    'https://api1.binance.com',
    'https://api2.binance.com',
    'https://api3.binance.com',
    'https://api-gcp.binance.com',
  ];

  const COLORS = {
    profit: '#10b981', loss: '#ef4444',
    up: '#22c55e',     down: '#ef4444',
    bg: '#0f172a',     grid: '#1e293b',
    text: '#94a3b8',   border: '#1e293b',
  };

  /* ================= FETCH С ТАЙМАУТОМ ================= */
  async function fetchT(url, ms = 10000) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    try {
      return await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    } finally {
      clearTimeout(t);
    }
  }

  /* ================= 1. KLINES ================= */
  async function fetch1sKlines() {
    const out = [];
    let cursor = START_MS;
    let hostIdx = 0;
    let guard = 0;

    while (cursor < END_MS && guard++ < 200) {
      let advanced = false;

      for (let attempt = 0; attempt < HOSTS.length; attempt++) {
        const host = HOSTS[hostIdx % HOSTS.length];
        hostIdx++;

        const url = `${host}/api/v3/klines?symbol=${SYMBOL}` +
                    `&interval=1s&startTime=${cursor}&endTime=${END_MS}&limit=1000`;
        const t0 = performance.now();
        try {
          log(`→ ${host} … (cursor=${new Date(cursor).toLocaleTimeString('ru-RU')})`);
          const res = await fetchT(url, 10000);
          const dt = (performance.now() - t0).toFixed(0);
          if (!res.ok) {
            log(`  HTTP ${res.status} за ${dt} ms`, 'text-amber-400');
            continue;
          }
          const batch = await res.json();
          if (!Array.isArray(batch)) { log('  ответ не массив', 'text-red-400'); continue; }
          if (batch.length === 0) {
            log(`  свечей нет (пусто) — прекращаю`, 'text-amber-400');
            return out;
          }
          out.push(...batch);
          log(`  ✓ +${batch.length} свечей (всего ${out.length}) за ${dt} ms`, 'text-emerald-400');

          const lastOpen = batch[batch.length - 1][0];
          cursor = lastOpen + 1000;
          advanced = true;
          if (batch.length < 1000) return out;
          break;
        } catch (e) {
          const dt = (performance.now() - t0).toFixed(0);
          const msg = e.name === 'AbortError' ? 'таймаут' : e.message;
          log(`  ✗ ${host}: ${msg} (${dt} ms)`, 'text-red-400');
        }
      }

      if (!advanced) {
        throw new Error('Все зеркала Binance недоступны (запросы не проходят)');
      }
    }
    return out;
  }

  function aggregateTo5s(klines) {
    const buckets = new Map();
    const stepMs = TF_SEC * 1000;
    for (const k of klines) {
      const bucketMs = Math.floor(k[0] / stepMs) * stepMs;
      const o = +k[1], h = +k[2], l = +k[3], c = +k[4];
      let b = buckets.get(bucketMs);
      if (!b) buckets.set(bucketMs, { time: Math.floor(bucketMs / 1000), open: o, high: h, low: l, close: c });
      else { if (h > b.high) b.high = h; if (l < b.low) b.low = l; b.close = c; }
    }
    return [...buckets.values()].sort((a, b) => a.time - b.time);
  }

  /* ================= 2. ПОЗИЦИИ ================= */
  function normalizePositions(data) {
    const toSec = v => {
      const n = Number(v);
      if (!Number.isFinite(n)) return NaN;
      return n > 1e12 ? Math.floor(n / 1000) : Math.floor(n);
    };
    return data.map(p => ({
      entryTime: toSec(p.entryTime), exitTime: toSec(p.exitTime),
      entryPrice: Number(p.entryPrice), exitPrice: Number(p.exitPrice),
      pnl: Number(p.pnl), side: p.side, qty: p.qty, reason: p.reason, pct: p.pct,
    })).filter(p =>
      Number.isFinite(p.entryTime) && Number.isFinite(p.exitTime) &&
      Number.isFinite(p.entryPrice) && Number.isFinite(p.exitPrice) &&
      Number.isFinite(p.pnl)
    ).sort((a, b) => a.entryTime - b.entryTime);
  }

  async function loadPositions() {
    const paths = ['../data/positions.json', './data/positions.json', './positions.json'];
    for (const path of paths) {
      try {
        log(`→ ${path} …`);
        const res = await fetchT(path, 5000);
        if (!res.ok) { log(`  HTTP ${res.status}`, 'text-amber-400'); continue; }
        const data = await res.json();
        if (!Array.isArray(data)) { log('  не массив', 'text-amber-400'); continue; }
        const norm = normalizePositions(data);
        log(`  ✓ позиций: ${norm.length}`, 'text-emerald-400');
        return norm;
      } catch (e) {
        log(`  ✗ ${path}: ${e.message}`, 'text-red-400');
      }
    }
    log('positions.json не найден — рисую только свечи', 'text-amber-400');
    return [];
  }

  /* ================= 3. СТАТИСТИКА ================= */
  function renderStats(positions, candles) {
    const totalPnl = positions.reduce((s, p) => s + p.pnl, 0);
    const wins = positions.filter(p => p.pnl > 0);
    const losses = positions.filter(p => p.pnl < 0);
    const gp = wins.reduce((s, p) => s + p.pnl, 0);
    const gl = Math.abs(losses.reduce((s, p) => s + p.pnl, 0));
    const winrate = positions.length ? (wins.length / positions.length) * 100 : 0;
    const pf = gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0);

    $('statTrades').textContent = positions.length;
    $('statWinrate').textContent = winrate.toFixed(1) + '%';
    $('statPf').textContent = pf === Infinity ? '∞' : pf.toFixed(2);

    const pnlEl = $('statPnl');
    pnlEl.textContent = (totalPnl >= 0 ? '+' : '') + totalPnl.toFixed(2);
    pnlEl.className = 'mt-1 text-xl font-semibold ' +
      (totalPnl > 0 ? 'text-emerald-400' : totalPnl < 0 ? 'text-red-400' : 'text-white');

    $('coinName').textContent = SYMBOL;
    if (candles.length) {
      const fmt = ts => new Date(ts * 1000).toLocaleString('ru-RU', { hour12: false });
      $('periodLabel').textContent = fmt(candles[0].time) + ' – ' + fmt(candles[candles.length - 1].time);
    }
  }

  /* ================= 4. ГРАФИК ================= */
  let chart, candleSeries;
  const tradeSeries = [];
  let markers = [];

  function buildChart(candles) {
    const el = $('chart');
    chart = LightweightCharts.createChart(el, {
      autoSize: true,
      layout: { background: { type: 'solid', color: COLORS.bg }, textColor: COLORS.text, fontSize: 11 },
      grid: { vertLines: { color: COLORS.grid }, horzLines: { color: COLORS.grid } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      rightPriceScale: { borderColor: COLORS.border, scaleMargins: { top: 0.12, bottom: 0.12 } },
      timeScale: {
        borderColor: COLORS.border, timeVisible: true, secondsVisible: true, rightOffset: 6,
      },
      localization: {
        timeFormatter: ts => new Date(ts * 1000).toLocaleTimeString('ru-RU', { hour12: false }),
      },
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: COLORS.up, downColor: COLORS.down,
      borderUpColor: COLORS.up, borderDownColor: COLORS.down,
      wickUpColor: COLORS.up, wickDownColor: COLORS.down,
    });
    candleSeries.setData(candles);
    log(`✓ График построен: ${candles.length} свечей`, 'text-emerald-400');
  }

  function snapToCandle(t, timeSet) {
    const step = TF_SEC;
    const b = Math.floor(t / step) * step;
    if (timeSet.has(b)) return b;
    for (let d = 1; d <= 60; d++) {
      if (timeSet.has(b - d * step)) return b - d * step;
      if (timeSet.has(b + d * step)) return b + d * step;
    }
    return null;
  }

  function drawTrades(positions, candles) {
    const timeSet = new Set(candles.map(c => c.time));
    let drawn = 0;
    for (const p of positions) {
      const tIn = snapToCandle(p.entryTime, timeSet);
      const tOut = snapToCandle(p.exitTime, timeSet);
      if (tIn == null || tOut == null) continue;
      const isProfit = p.pnl >= 0;
      const color = isProfit ? COLORS.profit : COLORS.loss;
      if (tIn !== tOut) {
        const line = chart.addLineSeries({
          color, lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Solid,
          priceLineVisible: false, lastValueVisible: false,
          crosshairMarkerVisible: false, autoscaleInfoProvider: () => null,
        });
        line.setData([{ time: tIn, value: p.entryPrice }, { time: tOut, value: p.exitPrice }]);
        tradeSeries.push(line);
      }
      const pnlText = (p.pnl >= 0 ? '+' : '') + p.pnl.toFixed(2);
      markers.push({ time: tIn, position: 'belowBar', color, shape: 'arrowUp', text: 'IN', size: 1 });
      markers.push({ time: tOut, position: 'aboveBar', color, shape: 'arrowDown', text: pnlText, size: 1 });
      drawn++;
    }
    markers.sort((a, b) => a.time - b.time);
    candleSeries.setMarkers(markers);
    chart.timeScale().fitContent();
    log(`✓ Отрисовано сделок: ${drawn} из ${positions.length}`, 'text-emerald-400');
  }

  /* ================= 5. ЗАПУСК ================= */
  try {
    const klines = await fetch1sKlines();
    log(`Итого 1s-свечей: ${klines.length}`);

    if (!klines.length) {
      log('Binance вернул 0 свечей. Причины: диапазон в будущем, либо 1s-klines не хранятся так давно.',
          'text-red-400');
      return;
    }

    const candles = aggregateTo5s(klines);
    log(`Агрегация → 5s: ${candles.length} свечей`);

    const positions = await loadPositions();

    buildChart(candles);
    renderStats(positions, candles);
    drawTrades(positions, candles);

    $('toggleTrades').addEventListener('change', e => {
      const v = e.target.checked;
      tradeSeries.forEach(s => s.applyOptions({ visible: v }));
      candleSeries.setMarkers(v ? markers : []);
    });

  } catch (err) {
    log(`ОШИБКА: ${err.message}`, 'text-red-400');
    console.error(err);
  }
})();
</script>
</body>
</html>
